<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Game</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="main">
        <h1>Siman Says Game</h1>
        <h2>Press any key to start the game</h2>

        <div class="btn-container">
            <div class="line-one">
                <div class="btn red" type="button"></div>
                <div class="btn yellow" type="button"></div>
            </div>
            <div class="line-two">
                <div class="btn green" type="button"></div>
                <div class="btn purple" type="button"></div>
            </div>
        </div>

        <div class="how-to-play">
            <h2>How to Play</h2>

            <p>
                <strong>Watch the sequence carefully</strong> and repeat it by clicking
                the buttons in the same order. The sequence gets longer with every round.
                Make one mistake and the game is over!
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
